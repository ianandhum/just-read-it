<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Just Read It</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="jri-popup">
      <header class="jri-heading">
        <div>
          <p class="jri-eyebrow">Just Read It</p>
          <h1>Read long-form content</h1>
        </div>
        <span id="status" class="jri-status">Off</span>
      </header>
      <section class="jri-card jri-reading-card">
        <button id="toggle" class="jri-btn">Enable Reading Mode</button>
        <p class="jri-card-description">Follow one sentence at a time, or listen as you read.</p>
      </section>
      <section class="jri-card jri-history-card" aria-labelledby="history-heading">
        <h2 id="history-heading">Reading Statistics</h2>
        <p id="history-description" class="jri-card-description">Note: Saved only on this device</p>
        <button id="enable-history" class="jri-secondary-btn jri-onboarding-btn" type="button">Keep Reading History</button>
        <div id="history-actions" class="jri-history-actions" hidden>
          <section class="jri-today-summary" aria-labelledby="today-heading">
            <div class="jri-today-heading">
              <span id="today-heading">Time engaged</span>
              <strong id="today-total">0m</strong>
            </div>
            <div id="today-chart" class="jri-today-chart" role="img" aria-label="Today's reading and listening time"></div>
            <div class="jri-today-breakdown">
              <span>
                Reading
                <strong id="today-reading">0m</strong>
              </span>
              <span>
                Listening
                <strong id="today-listening">0m</strong>
              </span>
            </div>
          </section>
          <button id="open-home" class="jri-secondary-btn" type="button">View Stats</button>
        </div>
      </section>
      <button id="open-settings" class="jri-settings-button" type="button">Preferences</button>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
